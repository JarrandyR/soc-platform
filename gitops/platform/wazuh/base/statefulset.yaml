apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-manager
  namespace: platform-wazuh
  labels:
    app: wazuh-manager
spec:
  serviceName: wazuh-manager
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-manager
  template:
    metadata:
      labels:
        app: wazuh-manager
      annotations:
        vector-config-rev: "8"
    spec:
      serviceAccountName: wazuh-manager
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 0

      initContainers:
        - name: init-wazuh-runtime
          image: busybox:1.36
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -e

              # ----------------------------
              # Create REQUIRED runtime trees
              # ----------------------------

              # VAR tree
              mkdir -p /var/ossec/var/run
              mkdir -p /var/ossec/var/db

              # QUEUE tree (modules + remoted + fim + tasks)
              mkdir -p /var/ossec/queue/sockets
              mkdir -p /var/ossec/queue/alerts
              mkdir -p /var/ossec/queue/db
              mkdir -p /var/ossec/queue/fim/db
              mkdir -p /var/ossec/queue/rids
              mkdir -p /var/ossec/queue/fts
              mkdir -p /var/ossec/queue/agent-info
              mkdir -p /var/ossec/queue/agent-groups
              mkdir -p /var/ossec/queue/tasks
              mkdir -p /var/ossec/queue/tasks/task
              mkdir -p /var/ossec/queue/tasks/upgrade

              # Files some modules expect
              [ -f /var/ossec/queue/rids/sender_counter ] || touch /var/ossec/queue/rids/sender_counter
              [ -f /var/ossec/queue/fts/hostinfo ] || touch /var/ossec/queue/fts/hostinfo

              # LOGS tree
              mkdir -p /var/ossec/logs/alerts
              mkdir -p /var/ossec/logs/archives

              # Wazuh creates year-based folders; on subPath mounts it can fail unless parent exists
              YEAR="$(date +%Y)"
              mkdir -p "/var/ossec/logs/firewall/${YEAR}"

              # logcollector expects this file
              [ -f /var/ossec/logs/active-responses.log ] || touch /var/ossec/logs/active-responses.log

              # alerts.json must exist (Vector tails it)
              if [ ! -f /var/ossec/logs/alerts/alerts.json ]; then
                touch /var/ossec/logs/alerts/alerts.json
              fi

              # Ownership + perms (Wazuh runs as wazuh inside container)
              chown -R wazuh:wazuh /var/ossec/var /var/ossec/queue /var/ossec/logs || true
              chmod -R 0775 /var/ossec/var /var/ossec/queue /var/ossec/logs || true
              chmod 0666 /var/ossec/logs/alerts/alerts.json || true

              echo "OK: Wazuh runtime dirs seeded"
          volumeMounts:
            - name: wazuh-data
              mountPath: /var/ossec/var
              subPath: var
            - name: wazuh-data
              mountPath: /var/ossec/queue
              subPath: queue
            - name: wazuh-data
              mountPath: /var/ossec/logs
              subPath: logs

      containers:
        - name: wazuh-manager
          image: wazuh/wazuh-manager:4.14.2
          imagePullPolicy: IfNotPresent
          env:
            - name: FILEBEAT_ENABLED
              value: "false"
          ports:
            - containerPort: 1514
              protocol: UDP
            - containerPort: 1514
              protocol: TCP
            - containerPort: 1515
              protocol: TCP
            - containerPort: 55000
              protocol: TCP
          resources:
            requests:
              cpu: "300m"
              memory: "1500Mi"
            limits:
              cpu: "1000m"
              memory: "2500Mi"
          volumeMounts:
            # ONLY subPaths. Never mount /var/ossec as a whole.
            - name: wazuh-data
              mountPath: /var/ossec/logs
              subPath: logs
            - name: wazuh-data
              mountPath: /var/ossec/queue
              subPath: queue
            - name: wazuh-data
              mountPath: /var/ossec/var
              subPath: var
            - name: wazuh-data
              mountPath: /var/ossec/integrations
              subPath: integrations

        - name: vector
          image: timberio/vector:0.53.0-alpine
          args: ["--config", "/etc/vector/vector.yaml"]
          readinessProbe:
            exec:
              command: ["sh","-lc","vector validate --config-yaml /etc/vector/vector.yaml"]
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          volumeMounts:
            - name: wazuh-data
              mountPath: /var/ossec/logs
              subPath: logs
            - name: vector-config
              mountPath: /etc/vector
            - name: vector-data
              mountPath: /vector-data-dir

      volumes:
        - name: vector-config
          configMap:
            name: vector-config
            optional: false
        - name: vector-data
          persistentVolumeClaim:
            claimName: vector-data

  volumeClaimTemplates:
    - metadata:
        name: wazuh-data
        labels:
          app: wazuh-manager
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 20Gi