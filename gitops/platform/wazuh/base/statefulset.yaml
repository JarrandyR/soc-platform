apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-manager
  namespace: platform-wazuh
  labels:
    app: wazuh-manager
spec:
  serviceName: wazuh-manager
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-manager
  template:
    metadata:
      labels:
        app: wazuh-manager
    spec:
      serviceAccountName: wazuh-manager
      terminationGracePeriodSeconds: 60

      initContainers:
        - name: init-pvc-dirs
          image: busybox:1.36
          command: ["sh","-lc"]
          args:
            - |
              set -e
              mkdir -p /data/logs/alerts
              mkdir -p /data/queue
              mkdir -p /data/var
              # filebeat can start even before Wazuh writes alerts
              touch /data/logs/alerts/alerts.json
          volumeMounts:
            - name: wazuh-data
              mountPath: /data

      containers:
        - name: wazuh-manager
          image: wazuh/wazuh-manager:4.14.2
          imagePullPolicy: IfNotPresent

          ports:
            - name: agent-udp
              containerPort: 1514
              protocol: UDP
            - name: agent-tcp
              containerPort: 1514
              protocol: TCP
            - name: enrollment
              containerPort: 1515
              protocol: TCP
            - name: api
              containerPort: 55000
              protocol: TCP

          resources:
            requests:
              cpu: "300m"
              memory: "1400Mi"
            limits:
              cpu: "1000m"
              memory: "2400Mi"

          volumeMounts:
            # ✅ Persist only writable runtime dirs (do NOT mount /var/ossec)
            - name: wazuh-data
              mountPath: /var/ossec/logs
              subPath: logs
            - name: wazuh-data
              mountPath: /var/ossec/queue
              subPath: queue
            - name: wazuh-data
              mountPath: /var/ossec/var
              subPath: var

            # ✅ Provide required filebeat config
            - name: filebeat-config
              mountPath: /etc/filebeat/filebeat.yml
              subPath: filebeat.yml

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -lc
                - "test -x /var/ossec/bin/wazuh-control && /var/ossec/bin/wazuh-control status | grep -qi running"
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12

          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -lc
                - "test -x /var/ossec/bin/wazuh-control && /var/ossec/bin/wazuh-control status | grep -qi running"
            initialDelaySeconds: 150
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6

      volumes:
        - name: filebeat-config
          configMap:
            name: wazuh-filebeat-config

  volumeClaimTemplates:
    - metadata:
        name: wazuh-data
        labels:
          app: wazuh-manager
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 15Gi
