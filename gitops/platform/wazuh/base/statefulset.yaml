apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-manager
  namespace: platform-wazuh
  labels:
    app: wazuh-manager
spec:
  serviceName: wazuh-manager
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-manager
  template:
    metadata:
      labels:
        app: wazuh-manager
    spec:
      serviceAccountName: wazuh-manager
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 0

      initContainers:
        - name: seed-ossec
          image: wazuh/wazuh-manager:4.14.2
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -euo pipefail
              if [ -f /data/.ossec_initialized ]; then
                echo "Wazuh /var/ossec already initialized."
                exit 0
              fi

              echo "Seeding /var/ossec into PVC..."
              mkdir -p /data
              cp -a /var/ossec/. /data/
              touch /data/.ossec_initialized

              mkdir -p /data/logs/alerts
              touch /data/logs/alerts/alerts.json

              echo "Seed complete."
          volumeMounts:
            - name: wazuh-data
              mountPath: /data

      containers:
        - name: wazuh-manager
          image: wazuh/wazuh-manager:4.14.2
          imagePullPolicy: IfNotPresent
          ports:
            - name: agent-udp
              containerPort: 1514
              protocol: UDP
            - name: agent-tcp
              containerPort: 1514
              protocol: TCP
            - name: enrollment
              containerPort: 1515
              protocol: TCP
            - name: api
              containerPort: 55000
              protocol: TCP
          resources:
            requests:
              cpu: "300m"
              memory: "1500Mi"
            limits:
              cpu: "1000m"
              memory: "2500Mi"
          volumeMounts:
            - name: wazuh-data
              mountPath: /var/ossec
            - name: filebeat-config
              mountPath: /etc/filebeat/filebeat.yml
              subPath: filebeat.yml
          readinessProbe:
            exec:
              command: ["/bin/sh","-lc","test -x /var/ossec/bin/wazuh-control && /var/ossec/bin/wazuh-control status | grep -qi running"]
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec:
              command: ["/bin/sh","-lc","test -x /var/ossec/bin/wazuh-control && /var/ossec/bin/wazuh-control status | grep -qi running"]
            initialDelaySeconds: 150
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6

        - name: vector
          image: timberio/vector:0.53.0-alpine
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/vector/vector.yaml"]
          ports:
            - name: vector-health
              containerPort: 8686
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          volumeMounts:
            - name: wazuh-data
              mountPath: /var/ossec
              readOnly: true
            - name: vector-config
              mountPath: /etc/vector
            - name: vector-data
              mountPath: /tmp/vector
          readinessProbe:
            httpGet:
              path: /health
              port: 8686
            initialDelaySeconds: 10
            periodSeconds: 10

      volumes:
        - name: vector-config
          configMap:
            name: wazuh-vector-config
        - name: filebeat-config
          configMap:
            name: wazuh-filebeat-config
        - name: vector-data
          emptyDir: {}

  volumeClaimTemplates:
    - metadata:
        name: wazuh-data
        labels:
          app: wazuh-manager
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 15Gi
