apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-manager
  namespace: platform-wazuh
  labels:
    app: wazuh-manager
spec:
  serviceName: wazuh-manager
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-manager
  template:
    metadata:
      labels:
        app: wazuh-manager
    spec:
      serviceAccountName: wazuh-manager
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 0

      initContainers:
        - name: init-alerts-file
          image: busybox:1.36
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -e
              mkdir -p /var/ossec/logs/alerts
              : > /var/ossec/logs/alerts/alerts.json
              chmod 0666 /var/ossec/logs/alerts/alerts.json || true
              ls -la /var/ossec/logs/alerts
          volumeMounts:
            - name: wazuh-data
              mountPath: /var/ossec/logs
              subPath: logs

      containers:
        - name: wazuh-manager
          image: wazuh/wazuh-manager:4.14.2
          imagePullPolicy: IfNotPresent
          env:
            - name: FILEBEAT_ENABLED
              value: "false"
          ports:
            - containerPort: 1514
              protocol: UDP
            - containerPort: 1514
              protocol: TCP
            - containerPort: 1515
              protocol: TCP
            - containerPort: 55000
              protocol: TCP
          resources:
            requests:
              cpu: "300m"
              memory: "1500Mi"
            limits:
              cpu: "1000m"
              memory: "2500Mi"
          volumeMounts:
            - name: wazuh-data
              mountPath: /var/ossec/logs
              subPath: logs
            - name: wazuh-data
              mountPath: /var/ossec/queue
              subPath: queue
            - name: wazuh-data
              mountPath: /var/ossec/var
              subPath: var
            - name: wazuh-data
              mountPath: /var/ossec/integrations
              subPath: integrations

        - name: vector
          image: timberio/vector:0.53.0-alpine
          # IMPORTANT: run Vector using the config file path directly (no --config flag)
          args: ["/etc/vector/vector.yaml"]
          readinessProbe:
            exec:
              command: ["sh","-lc","vector validate --config-yaml /etc/vector/vector.yaml"]
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          volumeMounts:
            - name: wazuh-data
              mountPath: /var/ossec/logs
              subPath: logs
            - name: vector-config
              mountPath: /etc/vector

      volumes:
        - name: vector-config
          configMap:
            name: wazuh-vector-config
            optional: false

  volumeClaimTemplates:
    - metadata:
        name: wazuh-data
        labels:
          app: wazuh-manager
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 15Gi
