apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-manager
  namespace: platform-wazuh
  labels:
    app: wazuh-manager
spec:
  serviceName: wazuh-manager
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-manager
  template:
    metadata:
      labels:
        app: wazuh-manager
    spec:
      serviceAccountName: wazuh-manager
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 0

      initContainers:
        - name: init-filebeat-config
          image: busybox:1.36
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -e
              mkdir -p /etc/filebeat
              cp /config/filebeat.yml /etc/filebeat/filebeat.yml
              chmod 0644 /etc/filebeat/filebeat.yml
          volumeMounts:
            - name: filebeat-config
              mountPath: /config
            - name: filebeat-etc
              mountPath: /etc/filebeat

      containers:
        - name: wazuh-manager
          image: wazuh/wazuh-manager:4.14.2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1514
              protocol: UDP
            - containerPort: 1514
              protocol: TCP
            - containerPort: 1515
              protocol: TCP
            - containerPort: 55000
              protocol: TCP
          resources:
            requests:
              cpu: "300m"
              memory: "1500Mi"
            limits:
              cpu: "1000m"
              memory: "2500Mi"
          volumeMounts:
            - name: wazuh-data
              mountPath: /var/ossec
            - name: filebeat-etc
              mountPath: /etc/filebeat

      volumes:
        - name: filebeat-config
          configMap:
            name: wazuh-filebeat-config
        - name: filebeat-etc
          emptyDir: {}

  volumeClaimTemplates:
    - metadata:
        name: wazuh-data
        labels:
          app: wazuh-manager
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 15Gi
