apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-manager
  namespace: platform-wazuh
  labels:
    app: wazuh-manager
spec:
  serviceName: wazuh-manager
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-manager
  template:
    metadata:
      labels:
        app: wazuh-manager
      annotations:
        vector-config-rev: "8"
    spec:
      serviceAccountName: wazuh-manager
      terminationGracePeriodSeconds: 60

      # LAB: run as root to remove permission blockers immediately.
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0

      initContainers:
        - name: init-wazuh-perms
          image: busybox:1.36
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eux
              mkdir -p /var/ossec/var/run
              mkdir -p /var/ossec/queue/{sockets,alerts,db,logcollector}
              mkdir -p /var/ossec/logs/alerts
              touch /var/ossec/logs/alerts/alerts.json
              chmod -R 0775 /var/ossec/var /var/ossec/queue /var/ossec/logs || true
              chmod 0666 /var/ossec/logs/alerts/alerts.json || true
              ls -la /var/ossec/var/run || true
              ls -la /var/ossec/queue/sockets || true
              ls -la /var/ossec/logs/alerts || true
          volumeMounts:
            - name: wazuh-data
              mountPath: /var/ossec/var
              subPath: var
            - name: wazuh-data
              mountPath: /var/ossec/queue
          subPath: queue
        - name: wazuh-data
              mountPath: /var/ossec/logs
              subPath: logs

      containers:
        - name: wazuh-manager
          image: wazuh/wazuh-manager:4.14.2
          imagePullPolicy: IfNotPresent

          # CRITICAL: bypass image init that starts filebeat/s6.
          # Start Wazuh manager daemons directly.
          command: ["/bin/sh","-lc"]
          args:
            - |
              set -eux
              # ensure filebeat never runs in this pod
              pkill -f filebeat || true
              rm -f /run/s6/services/filebeat/down || true
              # start wazuh manager
              /var/ossec/bin/wazuh-control start
              # keep container alive and surface logs
              tail -F /var/ossec/logs/ossec.log

          env:
            - name: FILEBEAT_ENABLED
              value: "false"

          ports:
            - containerPort: 1514
              protocol: UDP
            - containerPort: 1514
              protocol: TCP
            - containerPort: 1515
              protocol: TCP
            - containerPort: 55000
              protocol: TCP

          readinessProbe:
            exec:
              command:
                - sh
                - -lc
                - /var/ossec/bin/wazuh-control status | grep -q "wazuh-analysisd is running"
            initialDelaySeconds: 25
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6

          resources:
            requests:
              cpu: "300m"
              memory: "1500Mi"
            limits:
              cpu: "1000m"
              memory: "2500Mi"

          volumeMounts:
            - name: wazuh-data
              mountPath: /var/ossec/logs
              subPath: logs
            - name: wazuh-data
              mountPath: /var/ossec/queue
              subPath: queue
            - name: wazuh-data
              mountPath: /var/ossec/var
              subPath: var
            - name: wazuh-data
              mountPath: /var/ossec/integrations
              subPath: integrations

        - name: vector
          image: timberio/vector:0.53.0-alpine
          args:
            - "--config-yaml"
            - "/etc/vector/vector.yaml"
          ports:
            - name: vector-api
              containerPort: 8686
              protocol: TCP
          readinessProbe:
            exec:
              command: ["sh","-lc","vector validate --config-yaml /etc/vector/vector.yaml"]
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8686
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          volumeMounts:
            - name: wazuh-data
              mountPath: /var/ossec/logs
          subPath: logs
        - name: vector-config
          mountPath: /etc/vector/vector.yaml
          subPath: vector.yaml
          readOnly: true
        - name: vector-data
          mountPath: /var/lib/vector

    volumes:
        - name: vector-config
          configMap:
            name: wazuh-vector-config
            optional: false

  volumeClaimTemplates:
    - metadata:
        name: wazuh-data
        labels:
          app: wazuh-manager
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 15Gi
          -metadata:
            name: vector-data
            labels:
          app: wazuh-manager
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
          storage: 2Gi