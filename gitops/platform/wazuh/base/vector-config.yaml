api:
  enabled: true
  address: 0.0.0.0:8686

# must exist
data_dir: /tmp

sources:
  sources:
  wazuh_alerts:
    type: file
    include:
      - /var/ossec/logs/alerts/alerts.json
    ignore_not_found: false

    # DO NOT miss events while testing
    read_from: beginning

    # FIX: avoid "too small to fingerprint" forever
    fingerprint:
      strategy: checksum
      bytes: 1

transforms:
  parse_json:
    type: remap
    inputs: ["wazuh_alerts"]
    source: |
      # parse line safely
      . = parse_json(.message) ?? {}

      ts = now()
      .["@timestamp"] = ts
      .event_source = "wazuh"
      .ingested_at = ts

      # safe rule.level
      if !exists(.rule) { .rule = {} }
      if !exists(.rule.level) { .rule.level = 0 }
      .rule.level = to_int(.rule.level) ?? 0

      # deterministic index name
      .index = "wazuh-alerts-" + format_timestamp!(ts, "%Y.%m.%d")

sinks:
   debug_console:
    type: console
    inputs: ["parse_json"]
    encoding:
      codec: json

  opensearch_all:
    type: elasticsearch
    inputs: ["parse_json"]
    endpoints:
      - "http://opensearch.platform-opensearch.svc.cluster.local:9200"
    api_version: "v7"
    mode: bulk
    compression: gzip
    bulk:
      index: "{{ index }}"
    request:
      timeout_secs: 10
      retry_attempts: 10
      retry_backoff_secs: 2
    batch:
      max_events: 200
      timeout_secs: 2

  # DEBUG (leave on until you see docs in OpenSearch, then remove)
  debug_console:
    type: console
    inputs: ["parse_json"]
    encoding:
      codec: json
