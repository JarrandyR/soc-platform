apiVersion: v1
kind: ConfigMap
metadata:
  name: wazuh-vector-config
  namespace: platform-wazuh
data:
  vector.yaml: |
    sources:
      wazuh_alerts:
        type: file
        include:
          - /var/ossec/logs/alerts/alerts.json
        read_from: beginning
        ignore_older: 0
        fingerprint:
          strategy: device_and_inode
        multiline:
          start_pattern: '^\{'
          mode: halt_before
          condition_pattern: '^\{'
        parsing:
          codec: json

    sinks:
      opensearch:
        type: elasticsearch
        inputs: ["wazuh_alerts"]
        endpoints:
          - http://opensearch.platform-opensearch.svc.cluster.local:9200
        mode: bulk
        compression: none
        bulk:
          index: "wazuh-alerts-%Y.%m.%d"
