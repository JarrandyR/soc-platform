apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  labels:
    app: wazuh-manager
data:
  vector.yaml: |
    api:
      enabled: true
      address: 0.0.0.0:8686
      playground: false

      # This is why you were getting 404 on /metrics
      prometheus:
        enabled: true

    # Must exist; you already set this right
    data_dir: /tmp

    sources:
      wazuh_alerts:
        type: file
        include:
          - /var/ossec/logs/alerts/alerts.json

        # TEMPORARY for testing so you cannot miss events during restarts.
        # After ingestion works, we can switch back to "end".
        read_from: beginning

        ignore_not_found: true

        # Make fingerprinting deterministic and avoid "too small to fingerprint" weirdness.
        fingerprint:
          strategy: checksum
          lines: 1
          ignored_header_bytes: 0

    transforms:
      parse_json:
        type: remap
        inputs: ["wazuh_alerts"]
        source: |
          # Parse JSON safely; if bad/empty line, just use {}
          . = parse_json(.message) ?? {}
          .event_source = "wazuh"
          .ingested_at = now()

          if !exists(.rule) { .rule = {} }
          if !exists(.rule.level) { .rule.level = 0 }
          .rule.level = to_int(.rule.level) ?? 0

      high_sev:
        type: filter
        inputs: ["parse_json"]
        condition: '(to_int(.rule.level) ?? 0) >= 10'

    sinks:
      # PROOF SINK: this will print JSON events into the vector container logs
      debug_console:
        type: console
        inputs: ["parse_json"]
        encoding:
          codec: json

      opensearch_all:
        type: elasticsearch
        inputs: ["parse_json"]
        endpoints:
          - "http://opensearch.platform-opensearch.svc.cluster.local:9200"
        api_version: "v7"
        mode: bulk
        bulk:
          index: "wazuh-alerts-%Y.%m.%d"
        healthcheck: true
        request:
          timeout_secs: 15
          retry_attempts: 10
          retry_backoff_secs: 2
        batch:
          max_events: 200
          timeout_secs: 2
