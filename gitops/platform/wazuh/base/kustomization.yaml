apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: platform-wazuh

resources:
  - serviceaccount.yaml
  - rbac.yaml
  - service.yaml
  - statefulset.yaml
  - vector-data-pvc.yaml

configMapGenerator:
  - name: wazuh-vector-config
    files:
      - vector.yaml=vector.yaml

generatorOptions:
  disableNameSuffixHash: true
