# gitops/platform/wazuh/base/kustomization.yaml

 apiVersion: kustomize.config.k8s.io/v1beta1
 kind: Kustomization

 resources:
 - statefulset.yaml
 - service.yaml
 - pvc.yaml
 # add any other wazuh resources you already have here

 configMapGenerator:
  - name: wazuh-vector-config
    files:
      - vector.yaml=vector.yaml

 generatorOptions:
 disableNameSuffixHash: true