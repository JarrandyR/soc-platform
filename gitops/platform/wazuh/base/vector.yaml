# gitops/platform/wazuh/base/vector.yaml
# Vector 0.53.x
# Wazuh -> Vector -> OpenSearch
# Adds: @timestamp, risk_score, severity_bucket, soc.*

data_dir: /var/lib/vector

api:
  enabled: true
  address: 0.0.0.0:8686

sources:
  wazuh_alerts_file:
    type: file
    include:
      - /var/ossec/logs/alerts/alerts.json
    read_from: beginning
    ignore_older_secs: 86400
    fingerprint:
      strategy: checksum

transforms:
  wazuh_enrich:
    type: remap
    inputs:
      - wazuh_alerts_file
    source: |
      # ----------------------------
      # 1) Parse newline JSON safely
      # ----------------------------
      . = parse_json!(.message)

      # ----------------------------
      # 2) Ensure @timestamp exists
      # ----------------------------
      # Wazuh typically provides "timestamp". We try common formats and fall back to now().
      if !exists(.["@timestamp"]) {
        ts = to_string(.timestamp) ?? null

        if ts != null {
          # Try a few common timestamp patterns
          dt =
            parse_timestamp(ts, "%+") ??
            parse_timestamp(ts, "%Y-%m-%dT%H:%M:%S%.f%z") ??
            parse_timestamp(ts, "%Y-%m-%dT%H:%M:%S%z") ??
            parse_timestamp(ts, "%Y-%m-%d %H:%M:%S") ??
            null

          if dt != null {
            .["@timestamp"] = dt
          }
        }

        if !exists(.["@timestamp"]) {
          .["@timestamp"] = now()
        }
      }

      # ---------------------------------------
      # 3) Pull core fields (defensive/default)
      # ---------------------------------------
      level = to_int(.rule.level) ?? 0
      rule_id = to_string(.rule.id) ?? "unknown"
      description = to_string(.rule.description) ?? ""

      agent_name = to_string(.agent.name) ?? to_string(.agent) ?? "unknown"
      host_name  = to_string(.host.name) ?? to_string(.hostname) ?? agent_name

      groups = .rule.groups ?? []
      groups_str = downcase!(join!(groups, " "))

      # ----------------------------
      # 4) Compute risk_score (0-100)
      # ----------------------------
      # Base from Wazuh rule.level (0-15) -> (0-100)
      base = (level * 100) / 15
      boost = 0

      # MITRE present usually means better signal
      if exists(.rule.mitre) { boost += 8 }
      if exists(.rule.mitre.technique) { boost += 6 }

      # Heuristic boosts from groups
      if contains(groups_str, "authentication") { boost += 6 }
      if contains(groups_str, "auth") { boost += 4 }
      if contains(groups_str, "malware") { boost += 10 }
      if contains(groups_str, "virus") { boost += 10 }
      if contains(groups_str, "rootcheck") { boost += 8 }
      if contains(groups_str, "syscheck") { boost += 5 }
      if contains(groups_str, "privilege") { boost += 12 }
      if contains(groups_str, "sudo") { boost += 10 }
      if contains(groups_str, "ransomware") { boost += 15 }
      if contains(groups_str, "persistence") { boost += 8 }
      if contains(groups_str, "lateral") { boost += 10 }

      # Nudge very high rule.level
      if level >= 12 { boost += 10 }
      if level >= 14 { boost += 10 }

      risk = to_int(base + boost) ?? 0
      if risk > 100 { risk = 100 }
      if risk < 0 { risk = 0 }

      .risk_score = risk

      # ----------------------------
      # 5) severity_bucket
      # ----------------------------
      if .risk_score >= 80 {
        .severity_bucket = "Critical"
      } else if .risk_score >= 60 {
        .severity_bucket = "High"
      } else if .risk_score >= 30 {
        .severity_bucket = "Medium"
      } else {
        .severity_bucket = "Low"
      }

      # -----------------------------------
      # 6) Normalized SOC helper fields
      # -----------------------------------
      .soc = .soc ?? {}
      .soc.rule_id = rule_id
      .soc.rule_level = level
      .soc.description = description
      .soc.agent_name = agent_name
      .soc.host_name = host_name
      .soc.groups = groups

sinks:
  opensearch_wazuh_alerts:
    type: opensearch
    inputs:
      - wazuh_enrich
    endpoints:
      - https://opensearch.platform-opensearch.svc.cluster.local:9200
    index: "wazuh-alerts-%Y.%m.%d"
    bulk:
      action: index
    auth:
      strategy: basic
      user: "${OPENSEARCH_USER}"
      password: "${OPENSEARCH_PASS}"
    tls:
      verify_certificate: false
      verify_hostname: false
    encoding:
      codec: json
    request:
      timeout_secs: 30
    healthcheck: true