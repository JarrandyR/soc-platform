apiVersion: v1
kind: ConfigMap
metadata:
  name: wazuh-manager-config
  namespace: platform-wazuh
data:
  ossec.conf: |
    <!-- Minimal safe baseline. Replace with your tuned config later. -->
    <ossec_config>
      <global>
        <jsonout_output>yes</jsonout_output>
        <alerts_log>yes</alerts_log>
        <logall>no</logall>
        <logall_json>no</logall_json>
      </global>

      <remote>
        <connection>secure</connection>
        <port>1514</port>
        <protocol>tcp</protocol>
      </remote>

      <auth>
        <disabled>no</disabled>
        <port>1515</port>
        <use_source_ip>yes</use_source_ip>
        <force_insert>yes</force_insert>
        <force_time>0</force_time>
        <purge>yes</purge>
        <use_password>no</use_password>
        <limit_maxagents>yes</limit_maxagents>
        <ciphers>HIGH:!ADH:!EXP:!MD5:!RC4:!3DES</ciphers>
        <ssl_verify_host>no</ssl_verify_host>
        <ssl_manager_cert>/var/ossec/etc/sslmanager.cert</ssl_manager_cert>
        <ssl_manager_key>/var/ossec/etc/sslmanager.key</ssl_manager_key>
        <ssl_auto_negotiate>yes</ssl_auto_negotiate>
      </auth>

      <cluster>
        <name>wazuh</name>
        <node_name>wazuh-manager</node_name>
        <node_type>master</node_type>
        <key>CHANGE_THIS_CLUSTER_KEY</key>
        <port>1516</port>
        <bind_addr>0.0.0.0</bind_addr>
        <nodes>
          <node>wazuh-manager</node>
        </nodes>
        <hidden>no</hidden>
        <disabled>yes</disabled>
      </cluster>
    </ossec_config>

  internal_options.conf: |
    # Keep defaults unless you know exactly why.
    # Example:
    # wazuh_modules.debug=0