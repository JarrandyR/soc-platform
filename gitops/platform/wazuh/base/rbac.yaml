apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wazuh-manager
  labels:
    app: wazuh-manager
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wazuh-manager
  labels:
    app: wazuh-manager
subjects:
  - kind: ServiceAccount
    name: wazuh-manager
roleRef:
  kind: Role
  name: wazuh-manager
  apiGroup: rbac.authorization.k8s.io
