apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wazuh-manager
  namespace: platform-wazuh
rules:
  - apiGroups: [""]
    resources: ["pods","services","endpoints"]
    verbs: ["get","list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wazuh-manager
  namespace: platform-wazuh
subjects:
  - kind: ServiceAccount
    name: wazuh-manager
    namespace: platform-wazuh
roleRef:
  kind: Role
  name: wazuh-manager
  apiGroup: rbac.authorization.k8s.io
