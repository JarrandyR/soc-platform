apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: platform-opensearch
  labels:
    app: opensearch
spec:
  clusterIP: None
  selector:
    app: opensearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200
    - name: transport
      port: 9300
      targetPort: 9300